<!DOCTYPE html>
<html>
  <head>
    <title>Enter User ID</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 10px;
        width: 200px;
      }
      input {
        width: 100%;
        padding: 5px;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <h3>Enter Your ID</h3>
    <input type="text" id="user-id" placeholder="Enter your ID here" />
    <button id="save-id">Save ID</button>
    <p id="status" style="color: green; display: none;">ID Saved!</p>
  </body>
  <script src="popup.js"></script>
</html>
